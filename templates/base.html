{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RealTimeSecurity</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            night: '#0a0a0f',
            panel: '#11131a',
            line: 'rgba(255,255,255,0.10)',
            neon: '#00ff88',
            alert: '#ff3366'
          }
        }
      }
    }
  </script>
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="min-h-screen bg-night text-slate-100 antialiased">
  <nav class="border-b border-line bg-[#0d0d14]/95 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <a class="text-sm font-semibold tracking-[0.24em] text-neon" href="{% url 'dashboard' %}">REALTIMESecurity</a>
      <div class="flex flex-wrap items-center gap-2 text-sm text-slate-300">
        {% if user.is_authenticated %}
          <a class="rounded border border-line px-3 py-1.5 hover:border-neon hover:text-neon" href="{% url 'dashboard' %}">Dashboard</a>
          <a class="rounded border border-line px-3 py-1.5 hover:border-neon hover:text-neon" href="{% url 'logs' %}">Logs</a>
          <a class="rounded border border-line px-3 py-1.5 hover:border-neon hover:text-neon" href="{% url 'upload' %}">Upload</a>
          <a class="rounded border border-line px-3 py-1.5 hover:border-neon hover:text-neon" href="{% url 'stream_page' %}">Live</a>
          <a class="rounded border border-line px-3 py-1.5 hover:border-alert hover:text-alert" href="{% url 'logout' %}">Logout</a>
        {% else %}
          <a class="rounded border border-line px-3 py-1.5 hover:border-neon hover:text-neon" href="{% url 'login' %}">Login</a>
          <a class="rounded border border-line px-3 py-1.5 hover:border-neon hover:text-neon" href="{% url 'register' %}">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="mx-auto max-w-7xl px-4 py-6">
    {% if messages %}
      <div class="mb-4 space-y-2">
        {% for message in messages %}
          <div class="rounded border border-line bg-panel px-4 py-3 text-sm text-slate-200">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
